name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: tmux (the tests start real tmux sessions)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
        env:
          TMUX: ""
